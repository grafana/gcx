name: 🧭 New Command Proposal
description: Propose a new command, provider, datasource kind or resource type, or a change to an existing command's surface
title: 🧭 New Command Proposal
labels: ["action/needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        **Please open this before writing the code.** Command paths, flags and positional syntax are stable within a major version, so placement and naming are the hardest parts of a change to fix later. We'd much rather discuss them here than on a finished pull request — see [CONTRIBUTING.md](https://github.com/grafana/gcx/blob/main/CONTRIBUTING.md).

        If you've already written it, that's fine — link the PR at the bottom and we'll review the idea first.

        Bug fixes, docs, tests and changes that don't alter the command surface don't need a proposal. Grafana product teams adding commands in their own product area don't need one either.

        Asking for something rather than planning to build it? Use the **✨ Feature Request** template instead.

  - type: textarea
    id: question
    attributes:
      label: What should this let a user do?
      description: Phrase it as something a person or agent would want to do, not as an API endpoint.
      placeholder: "See which of my SLOs are burning error budget fastest this week."
    validations:
      required: true

  - type: textarea
    id: existing
    attributes:
      label: Why can't an existing command do this?
      description: |
        Check `gcx help-tree` and `gcx commands --flat` first. Could an existing command take one more flag, or is this covered by a standard verb (`list`, `get`, `create`, `update`, `upsert`, `push`, `pull`, `delete`, `query`, `search`)? Name the nearest existing command and how someone would choose between the two.
      placeholder: "`gcx slo definitions list` returns definitions but has no burn-rate data ..."
    validations:
      required: true

  - type: textarea
    id: shape
    attributes:
      label: Proposed command path, arguments, flags and output
      description: |
        A rough sketch is fine. See the [command naming guide](https://github.com/grafana/gcx/blob/main/docs/design/command-naming.md).
      placeholder: |
        gcx slo reports burn-rate [SLO-UID...] --since 7d
        Output: table of SLO, burn rate, remaining budget (-o json for agents)
      render: text
    validations:
      required: true

  - type: dropdown
    id: stability
    attributes:
      label: Stable or experimental?
      description: |
        Experimental commands are exempt from the compatibility promise. Anything backed by a non-GA product feature, or whose shape isn't settled yet, should be experimental.
      options:
        - Experimental
        - Stable
        - Not sure — happy to be advised
    validations:
      required: true

  - type: textarea
    id: backend
    attributes:
      label: Which API serves this?
      description: The product API or Grafana endpoint, whether it's GA, and who owns it. Note anything you know about pagination, auth/RBAC or limits.
    validations:
      required: true

  - type: dropdown
    id: writes
    attributes:
      label: Does it modify anything?
      options:
        - "No — read-only"
        - "Yes — it creates, updates or deletes something"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: |
        Who asked for this, whether you're willing to implement it, or a link to an existing PR or prototype. If you used an AI assistant to explore this, that's fine — just make sure you've read what it produced.
    validations:
      required: false
