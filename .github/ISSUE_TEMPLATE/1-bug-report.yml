name: Bug report
description: Report behavior that is not working as expected
type: Bug
labels: ["action/needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        **Title tip:** Name the symptom so others can find the report.

        Check [existing issues](https://github.com/grafana/gcx/issues) for a matching report. See the [contribution workflow](https://github.com/grafana/gcx/blob/main/CONTRIBUTING.md#contribution-workflow) for what happens next.

        This issue is public. Remove credentials and replace stack names, URLs, IDs and other identifying details with placeholders. Report security vulnerabilities through the [private security channel](https://github.com/grafana/gcx/security/policy).

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and how does it affect your work? Include the command and relevant output when applicable.
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected behavior
      description: What should have happened instead?
    validations:
      required: true

  - type: textarea
    id: reproduction_or_evidence
    attributes:
      label: Reproduction or evidence
      description: Share steps to reproduce, a minimal example, or evidence such as sanitized logs or screenshots. If reproduction is uncertain, describe what you observed and when.
    validations:
      required: true

  - type: input
    id: gcx_version
    attributes:
      label: gcx version
      description: "Run `gcx --version` to get this information."

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, shell and Grafana version, where relevant. Include Go version if building from source.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: When did this start? Include relevant changes, workarounds or troubleshooting already tried.
