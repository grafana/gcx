name: Publish gcx.wasm
# Publishes gcx built for wasip1, for embedding with experimental/sandbox, as
# ghcr.io/grafana/gcx-wasm: FROM scratch images holding
#
#   /gcx.wasm     the module
#   /gcx.commit   the gcx commit it was built from
#   /cache/       wazero's compiled code for it (pass as sandbox Config.CacheDir)
#
# so a Dockerfile can `COPY --from` them and skip both building gcx and the
# ~40 s compile at startup. The module is architecture-independent, but the
# compiled code is not, so each platform's image carries its own, compiled
# natively on that platform.
#
# Tags: sha-<commit> and sha-<12-char commit> always; main on main; and
# sandbox-vX.Y.Z for experimental/sandbox/vX.Y.Z tags. A sandbox host must run
# a module from the same gcx version, so consumers pin by sandbox version or
# commit, not main.
on:
  push:
    branches: [main]
    tags: ["experimental/sandbox/v*"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: publish-gcx-wasm-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/grafana/gcx-wasm

jobs:
  build:
    name: Build gcx.wasm
    if: github.repository == 'grafana/gcx'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # No build caches in this workflow: it publishes what it builds.
      - name: Setup mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4
        with:
          install: true
          cache: false

      - name: Build gcx.wasm
        run: |
          experimental/sandbox/build.sh
          git rev-parse HEAD >experimental/sandbox/gcx.commit

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gcx-wasm
          path: |
            experimental/sandbox/gcx.wasm
            experimental/sandbox/gcx.commit
          if-no-files-found: error
          retention-days: 1

  precompile:
    name: Precompile and push (${{ matrix.platform }})
    needs: build
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write # push ghcr.io/grafana/gcx-wasm
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4
        with:
          install: true
          cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gcx-wasm
          path: ${{ runner.temp }}/image

      # Compiles natively for this runner's architecture with the wazero version
      # this module pins, then runs `gcx version` as a smoke test.
      - name: Precompile
        working-directory: experimental/sandbox
        env:
          IMAGE_DIR: ${{ runner.temp }}/image
        run: go run ./internal/cmd/precompile "$IMAGE_DIR/gcx.wasm" "$IMAGE_DIR/cache"

      - name: Push by digest
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIR: ${{ runner.temp }}/image
          PLATFORM: ${{ matrix.platform }}
          DIGEST_DIR: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          printf 'FROM scratch\nCOPY gcx.wasm gcx.commit /\nCOPY cache /cache\n' >"$IMAGE_DIR/Dockerfile"
          echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker buildx create --use --driver docker-container >/dev/null
          docker buildx build \
            --platform "$PLATFORM" \
            --provenance=false \
            --label "org.opencontainers.image.source=https://github.com/grafana/gcx" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --metadata-file "$RUNNER_TEMP/metadata.json" \
            --output "type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=true" \
            "$IMAGE_DIR"
          mkdir -p "$DIGEST_DIR"
          jq -r '."containerimage.digest"' "$RUNNER_TEMP/metadata.json" >"$DIGEST_DIR/${PLATFORM//\//-}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ strategy.job-index }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Tag the multi-platform image
    needs: precompile
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # tag ghcr.io/grafana/gcx-wasm

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests

      - name: Create and push the index
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST_DIR: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          tags=(--tag "$IMAGE:sha-$GITHUB_SHA" --tag "$IMAGE:sha-${GITHUB_SHA:0:12}")
          case "$GITHUB_REF" in
          refs/heads/main) tags+=(--tag "$IMAGE:main") ;;
          refs/tags/experimental/sandbox/v*) tags+=(--tag "$IMAGE:sandbox-${GITHUB_REF#refs/tags/experimental/sandbox/}") ;;
          esac
          sources=()
          for f in "$DIGEST_DIR"/*; do sources+=("$IMAGE@$(cat "$f")"); done

          echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.source=https://github.com/grafana/gcx" \
            --annotation "index:org.opencontainers.image.revision=$GITHUB_SHA" \
            "${tags[@]}" \
            "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA"
