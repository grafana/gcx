name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Allow only one concurrent release, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow them to complete.
concurrency:
  group: "releases"
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write # to push new branches
    name: Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Set release notes
        run: |
          delimiter="$(openssl rand -hex 16)"
          {
            echo "RELEASE_NOTES<<${delimiter}"
            cat .release-notes.md
            echo "${delimiter}"
          } >> "$GITHUB_ENV"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@1a80836c5c9d9e5755a25cb59ec6f45a3b5f41a8 # v7.2.1
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: ${{ env.RELEASE_NOTES }}

  packslip:
    needs: release
    permissions:
      contents: read
      id-token: write # to sign the Packslip manifest
      attestations: write # to attest release artifacts
    name: Publish Packslip manifest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build active skill resources
        id: skills
        run: |
          resources="$(ruby -ryaml -e '
            catalog = YAML.load_file("claude-plugin/skills-catalog.yaml")["skills"]
            catalog.each do |name, metadata|
              next unless metadata["status"] == "active"
              path = "claude-plugin/skills/#{name}"
              abort "missing skill directory: #{path}" unless File.directory?(path)
              puts "skill/#{name}=repo:#{path}"
            end
          ' | sort)"
          delimiter="$(openssl rand -hex 16)"
          {
            echo "resources<<${delimiter}"
            echo "$resources"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Publish signed Packslip manifest
        id: packslip
        uses: jdx/packslip@4920350c39c234c7a969f9775040bd02829f1923 # v1.3.0
        with:
          download: gcx_*.tar.gz gcx_*.zip
          bin: gcx
          attest: true
          upload: false
          resources: ${{ steps.skills.outputs.resources }}

      - name: Upload Packslip bundle for publisher
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packslip-bundle
          path: ${{ steps.packslip.outputs.bundle }}
          if-no-files-found: error

  publish-packslip:
    needs: packslip
    permissions:
      contents: write
    name: Publish Packslip bundle
    runs-on: ubuntu-latest
    steps:
      - name: Download Packslip bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packslip-bundle

      - name: Upload Packslip bundle to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -f packslip.sigstore.json
          gh release upload "$TAG" packslip.sigstore.json --repo "$REPOSITORY" --clobber
