name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Allow only one concurrent release, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow them to complete.
concurrency:
  group: "releases"
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write # to push new branches
    name: Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Set release notes
        run: |
          delimiter="$(openssl rand -hex 16)"
          {
            echo "RELEASE_NOTES<<${delimiter}"
            cat .release-notes.md
            echo "${delimiter}"
          } >> "$GITHUB_ENV"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@1a80836c5c9d9e5755a25cb59ec6f45a3b5f41a8 # v7.2.1
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: ${{ env.RELEASE_NOTES }}

      - name: Upload release artifacts for Packslip
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: |
            dist/gcx_*.tar.gz
            dist/gcx_*.zip
          if-no-files-found: error

  packslip:
    needs: release
    permissions:
      contents: read
      id-token: write # to sign the Packslip manifest
      attestations: write # to attest release artifacts
    name: Publish Packslip manifest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download release artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-artifacts
          path: dist

      - name: Build active skill resources
        id: skills
        run: |
          resources="$(ruby -ryaml -e '
            catalog = YAML.load_file("claude-plugin/skills-catalog.yaml")["skills"]
            catalog.each do |name, metadata|
              next unless metadata["status"] == "active"
              path = "claude-plugin/skills/#{name}"
              abort "missing skill directory: #{path}" unless File.directory?(path)
              puts "skill/#{name}=repo:#{path}"
            end
          ' | sort)"
          {
            echo 'resources<<EOF'
            echo "$resources"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Publish signed Packslip manifest
        uses: jdx/packslip@4920350c39c234c7a969f9775040bd02829f1923 # v1.3.0
        with:
          artifacts: dist/gcx_*.tar.gz dist/gcx_*.zip
          bin: gcx
          attest: true
          resources: ${{ steps.skills.outputs.resources }}
