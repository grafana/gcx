name: Claude Code Review

on:
  pull_request:
    types:
      - opened           # Non-draft PR opened
      - ready_for_review  # Draft PR marked ready
      - unlabeled        # Re-review when 'claude-reviewed' label is removed
  issue_comment:
    types:
      - created          # Re-review on '@claude review'

jobs:
  claude-review:
    # Two entry points.
    #
    # pull_request: opened/ready_for_review (if not draft), or unlabeled only
    # when the removed label is 'claude-reviewed'. Skip all bot PRs (Renovate,
    # etc.) — user.type is 'Bot' for GitHub App accounts, 'User' for humans.
    #
    # issue_comment: a top-level '@claude review' on a PR, matching the command
    # people know from the Code Review docs. Without this the comment fell
    # through to claude.yml, which runs a general-purpose session instead of the
    # review. gcx is a public repo, so the comment path carries the same
    # author-association guard as claude.yml: without it any commenter could
    # mint a Vault secret.
    if: |
      (github.event_name == 'pull_request' &&
        github.event.pull_request.user.type != 'Bot' &&
        github.event.pull_request.draft == false &&
        (github.event.action != 'unlabeled' || github.event.label.name == 'claude-reviewed')) ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        startsWith(github.event.comment.body, '@claude review') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      # One number for both entry points: pull_request carries it on the PR,
      # issue_comment on the issue.
      - name: Resolve pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          echo "number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json headRefOid --jq '"head_sha=" + .headRefOid' >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1
          # A pull_request event checks out the merge ref already. An
          # issue_comment event would otherwise check out the default branch,
          # so the review would grep the base instead of the PR's code.
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/merge', steps.pr.outputs.number) || github.ref }}

      - name: Get Vault secrets
        id: get-secrets
        uses: grafana/shared-workflows/actions/get-vault-secrets@a53fc80bc30b0a16a262520465db899fa3af08b7 # get-vault-secrets/v1.3.2
        with:
          # Keep the secret on the step output instead of exporting it into
          # $GITHUB_ENV for every later step (incl. claude-code-action).
          export_env: false
          repo_secrets: |
            ANTHROPIC_API_KEY=anthropic-api-key:api_key

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@dde2242db6af13460b916652159b6ba19a598f30 # v1
        with:
          anthropic_api_key: ${{ fromJSON(steps.get-secrets.outputs.secrets).ANTHROPIC_API_KEY }}
          use_sticky_comment: true
          # The skill owns the correctness pass, report, and severity policy.
          # The workflow owns publication, so no review plugin or inline-comment
          # tool publishes findings before the combined report is complete.
          prompt: |
            Invoke the /review-pr skill to review
            ${{ github.repository }}/pull/${{ steps.pr.outputs.number }}.
            This is an unattended workflow run.
            Review head: ${{ steps.pr.outputs.head_sha }}
            Return a structured review payload using Workflow delivery in the
            skill. Do not publish through gh, a plugin, or an inline-comment tool.
            The next workflow step submits and verifies one COMMENT review.
          claude_args: >-
            --model claude-opus-4-6
            --json-schema '{"type":"object","required":["review"],"additionalProperties":false,
              "properties":{"review":{"anyOf":[{"type":"null"},{"type":"object",
                "required":["body","comments"],"additionalProperties":false,
                "properties":{"body":{"type":"string","minLength":1},
                  "comments":{"type":"array","items":{"type":"object",
                    "required":["path","line","side","body"],"additionalProperties":false,
                    "properties":{"path":{"type":"string"},"line":{"type":"integer","minimum":1},
                      "side":{"type":"string","enum":["LEFT","RIGHT"]},"body":{"type":"string"},
                      "start_line":{"type":"integer","minimum":1},
                      "start_side":{"type":"string","enum":["LEFT","RIGHT"]}}}}}}]}}}'

      # The transcript records every tool call and every permission denial.
      # Without it a review that silently denied its way to no output looks
      # identical to one that found nothing.
      - name: Upload Claude session transcript
        if: always() && steps.claude-review.outputs.execution_file != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: claude-review-transcript-${{ steps.pr.outputs.number }}
          path: ${{ steps.claude-review.outputs.execution_file }}
          retention-days: 7

      - name: Publish review and add claude-reviewed label
        id: publish-review
        if: success()
        shell: bash
        env:
          # The action revokes its App token before returning. Publish with
          # the job token, which remains valid and uses github-actions[bot].
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          REVIEW_HEAD: ${{ steps.pr.outputs.head_sha }}
          REVIEW_MARKER: '<!-- gcx-claude-review:${{ github.run_id }}:${{ github.run_attempt }} -->'
          REVIEW_OUTPUT: ${{ steps.claude-review.outputs.structured_output }}
        run: |
          set -euo pipefail
          check_head() {
            local current_head
            current_head=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --json headRefOid --jq .headRefOid)
            if [[ "$current_head" != "$REVIEW_HEAD" ]]; then
              echo "::error::The PR changed during the review. Run @claude review again."
              exit 1
            fi
          }

          if ! payload=$(jq -ce --arg head "$REVIEW_HEAD" --arg marker "$REVIEW_MARKER" '
            .review | select(type == "object")
            | select((.body | type == "string" and length > 0) and (.comments | type == "array"))
            | {event: "COMMENT", commit_id: $head, body: (.body + "\n\n" + $marker), comments}
          ' <<< "$REVIEW_OUTPUT"); then
            echo "::error::No complete review payload. Check the transcript and run @claude review again."
            exit 1
          fi
          check_head
          # Validate the response to this run's POST, never an older review.
          review=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews" \
            -X POST --input - <<< "$payload")
          if ! review_id=$(jq -er --arg head "$REVIEW_HEAD" --arg marker "$REVIEW_MARKER" '
            select(.user.login == "github-actions[bot]" and .state == "COMMENTED" and
              .commit_id == $head and ((.body // "") | contains($marker)) and
              (.submitted_at | type == "string" and length > 0))
            | .id | select(type == "number" and . > 0 and floor == .)
          ' <<< "$review"); then
            echo "::error::GitHub did not confirm this run published a COMMENT review for the reviewed commit. Check the transcript."
            exit 1
          fi
          echo "review_id=$review_id" >> "$GITHUB_OUTPUT"
          check_head
          gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label claude-reviewed
