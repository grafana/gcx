name: Claude Code Review

on:
  pull_request:
    types:
      - opened           # Non-draft PR opened
      - ready_for_review  # Draft PR marked ready
      - unlabeled        # Re-review when 'claude-reviewed' label is removed
  issue_comment:
    types:
      - created          # Re-review on '@claude review'

jobs:
  claude-review:
    # Two entry points.
    #
    # pull_request: opened/ready_for_review (if not draft), or unlabeled only
    # when the removed label is 'claude-reviewed'. Skip all bot PRs (Renovate,
    # etc.) — user.type is 'Bot' for GitHub App accounts, 'User' for humans.
    #
    # issue_comment: a top-level '@claude review' on a PR, matching the command
    # people know from the Code Review docs. Without this the comment fell
    # through to claude.yml, which runs a general-purpose session instead of the
    # review. gcx is a public repo, so the comment path carries the same
    # author-association guard as claude.yml: without it any commenter could
    # mint a Vault secret.
    if: |
      (github.event_name == 'pull_request' &&
        github.event.pull_request.user.type != 'Bot' &&
        github.event.pull_request.draft == false &&
        (github.event.action != 'unlabeled' || github.event.label.name == 'claude-reviewed')) ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        startsWith(github.event.comment.body, '@claude review') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      # One number for both entry points: pull_request carries it on the PR,
      # issue_comment on the issue.
      - name: Resolve pull request number
        id: pr
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: echo "number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1
          # A pull_request event checks out the merge ref already. An
          # issue_comment event would otherwise check out the default branch,
          # so the review would grep the base instead of the PR's code.
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/merge', steps.pr.outputs.number) || github.ref }}

      - name: Get Vault secrets
        id: get-secrets
        uses: grafana/shared-workflows/actions/get-vault-secrets@a53fc80bc30b0a16a262520465db899fa3af08b7 # get-vault-secrets/v1.3.2
        with:
          # Keep the secret on the step output instead of exporting it into
          # $GITHUB_ENV for every later step (incl. claude-code-action).
          export_env: false
          repo_secrets: |
            ANTHROPIC_API_KEY=anthropic-api-key:api_key

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@dde2242db6af13460b916652159b6ba19a598f30 # v1
        with:
          anthropic_api_key: ${{ fromJSON(steps.get-secrets.outputs.secrets).ANTHROPIC_API_KEY }}
          use_sticky_comment: true
          # Buffer findings and classify them before posting, so severity
          # labelling comes from the action rather than from prompt discipline.
          classify_inline_comments: true
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # The review process lives entirely in the repo-local review-pr
          # skill, so a PR gets the same treatment whether a developer runs it
          # locally or this workflow does. Everything that used to be repeated
          # here — the two passes, the report shape, the unattended-run
          # overrides, the closing line — is in that file. Keep it that way:
          # a rule added here instead of there applies to CI only, and silently
          # stops applying the moment someone reviews the same PR locally.
          prompt: |
            Review ${{ github.repository }}/pull/${{ steps.pr.outputs.number }}
            with the /review-pr skill. Invoke it as a skill; reading the file
            leaves its unattended-run rules unapplied.
          # Pin the model to keep the behaviour consistent. Tool permissions
          # live in .claude/settings.json, which this session loads as a
          # project setting source, so a local /review-pr run and this workflow
          # get the same allowlist instead of drifting apart.
          claude_args: '--model claude-opus-4-6'

      # The transcript records every tool call and every permission denial.
      # Without it a review that silently denied its way to no output looks
      # identical to one that found nothing.
      - name: Upload Claude session transcript
        if: always() && steps.claude-review.outputs.execution_file != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: claude-review-transcript-${{ steps.pr.outputs.number }}
          path: ${{ steps.claude-review.outputs.execution_file }}
          retention-days: 7

      - name: Add claude-reviewed label
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr edit "${{ steps.pr.outputs.number }}" --add-label claude-reviewed
