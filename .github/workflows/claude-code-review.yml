name: Claude Code Review

on:
  pull_request:
    types:
      - opened           # Non-draft PR opened
      - ready_for_review  # Draft PR marked ready
  issue_comment:
    types:
      - created          # Re-review on '@claude review'

jobs:
  claude-review:
    # Two entry points.
    #
    # pull_request: opened/ready_for_review, if not draft. Skip all bot PRs
    # (Renovate, etc.) — user.type is 'Bot' for GitHub App accounts, 'User'
    # for humans.
    #
    # issue_comment: a top-level '@claude review' on a PR, matching the command
    # people know from the Code Review docs. Without this the comment fell
    # through to claude.yml, which runs a general-purpose session instead of the
    # review. gcx is a public repo, so the comment path carries the same
    # author-association guard as claude.yml: without it any commenter could
    # mint a Vault secret.
    #
    # '@claude review' is the only re-review path. There is no review-outcome
    # label to remove: the published review carries the commit it reviewed, so
    # a second signal would only add a second thing to keep true.
    if: |
      (github.event_name == 'pull_request' &&
        github.event.pull_request.user.type != 'Bot' &&
        github.event.pull_request.draft == false) ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        startsWith(github.event.comment.body, '@claude review') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    # A review costs several dollars and a quarter of an hour. Opening a PR as
    # ready, or asking twice, must not buy two of them.
    concurrency:
      group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    env:
      # The review payload contract, in one place: the action validates the
      # session's output against it, the publish step below submits it, and
      # scripts/review_workflow_test.go asserts the skill documents the same
      # shape. `null` means the review did not complete; an object with an
      # empty comments array is a complete review that found nothing.
      REVIEW_SCHEMA: >-
        {"type":"object","required":["review"],"additionalProperties":false,
        "properties":{"review":{"anyOf":[{"type":"null"},
        {"type":"object","required":["body","comments"],"additionalProperties":false,
        "properties":{"body":{"type":"string","minLength":1},
        "comments":{"type":"array","items":{"type":"object",
        "required":["path","line","side","body"],"additionalProperties":false,
        "properties":{"path":{"type":"string","minLength":1},
        "line":{"type":"integer","minimum":1},
        "side":{"type":"string","enum":["LEFT","RIGHT"]},
        "body":{"type":"string","minLength":1},
        "start_line":{"type":"integer","minimum":1},
        "start_side":{"type":"string","enum":["LEFT","RIGHT"]}}}}}}]}}}
    steps:
      # One number for both entry points: pull_request carries it on the PR,
      # issue_comment on the issue. The head SHA pins everything below to the
      # commit that was actually reviewed.
      - name: Resolve pull request
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          echo "number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json headRefOid --jq '"head_sha=" + .headRefOid' >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1
          # A pull_request event checks out the merge ref already. An
          # issue_comment event would otherwise check out the default branch,
          # so the review would grep the base instead of the PR's code.
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/merge', steps.pr.outputs.number) || github.ref }}

      - name: Get Vault secrets
        id: get-secrets
        uses: grafana/shared-workflows/actions/get-vault-secrets@a53fc80bc30b0a16a262520465db899fa3af08b7 # get-vault-secrets/v1.3.2
        with:
          # Keep the secret on the step output instead of exporting it into
          # $GITHUB_ENV for every later step (incl. claude-code-action).
          export_env: false
          repo_secrets: |
            ANTHROPIC_API_KEY=anthropic-api-key:api_key

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@dde2242db6af13460b916652159b6ba19a598f30 # v1
        with:
          anthropic_api_key: ${{ fromJSON(steps.get-secrets.outputs.secrets).ANTHROPIC_API_KEY }}
          # The review process lives entirely in the repo-local review-pr
          # skill, so a PR gets the same treatment whether a developer runs it
          # locally or this workflow does. Everything that used to be repeated
          # here — the correctness pass, the report shape, the unattended-run
          # overrides, the closing line — is in that file. Keep it that way:
          # a rule added here instead of there applies to CI only, and silently
          # stops applying the moment someone reviews the same PR locally.
          # What stays in the prompt is only what the skill cannot know: which
          # PR, which commit, that delivery is structured, and what this runner
          # can actually run.
          #
          # No `plugins:`/`plugin_marketplaces:` here on purpose. A skill or a
          # plugin command is prompt text loaded into this one conversation,
          # not a call that returns, so the upstream code-review command's
          # closing instruction ("no --comment argument was provided, so
          # stopping here without posting") ends the gcx review with it. That
          # is what happened on #1299 and #1313. The skill owns the correctness
          # pass instead.
          prompt: |
            Invoke the /review-pr skill to review
            ${{ github.repository }}/pull/${{ steps.pr.outputs.number }}.
            Invoke it as a skill; reading the file leaves its unattended-run
            rules unapplied.

            This is an unattended workflow run requesting Workflow delivery.
            Review head: ${{ steps.pr.outputs.head_sha }}

            Return the structured review payload and publish nothing. The next
            workflow step submits the review and checks GitHub's response.

            What this run can do, which the skill cannot know: it reads the
            checked-out code and the PR. It cannot build, run tests, write
            files, or regenerate documentation, and a compound shell command is
            refused one part at a time. Nobody can approve a denied command and
            no other spelling of it is allowed either, so when one is denied,
            review what you can read instead.
          # Pin the model to keep the behaviour consistent. Tool permissions
          # live in .claude/settings.json, which this session loads as a
          # project setting source, so a local /review-pr run and this workflow
          # get the same allowlist instead of drifting apart. The denials below
          # are on top of it: that allowlist has to admit publishing for a
          # human-invoked local review, and here the workflow publishes.
          claude_args: >-
            --model claude-opus-5
            --json-schema '${{ env.REVIEW_SCHEMA }}'
            --disallowedTools "Edit,Write,NotebookEdit,Bash(gh pr comment *),Bash(gh pr review *),Bash(gh api *),mcp__github_inline_comment__create_inline_comment"

      # The transcript records every tool call and every permission denial.
      # Without it a review that silently denied its way to no output looks
      # identical to one that found nothing.
      - name: Upload Claude session transcript
        if: always() && steps.claude-review.outputs.execution_file != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: claude-review-transcript-${{ steps.pr.outputs.number }}
          path: ${{ steps.claude-review.outputs.execution_file }}
          retention-days: 7
          # A re-run reuses the run id, and this action fails on a duplicate
          # artifact name. Without this, attempt 2 fails here.
          overwrite: true

      # Publication is ordinary workflow code, so a review either appears on
      # the PR or the job fails. Nothing here depends on the session choosing a
      # posting tool, or finding a spelling of one that clears the permission
      # rules it runs under.
      - name: Publish review
        # An explicit status function overrides GitHub's implicit success()
        # gate, so a failed transcript upload cannot swallow a completed
        # review. Cancelled runs and failed reviews must not publish.
        if: ${{ !cancelled() && steps.claude-review.outcome == 'success' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          REVIEW_HEAD: ${{ steps.pr.outputs.head_sha }}
          REVIEW_MARKER: '<!-- gcx-claude-review:${{ github.run_id }}:${{ github.run_attempt }} -->'
          REVIEW_OUTPUT: ${{ steps.claude-review.outputs.structured_output }}
        run: |
          set -euo pipefail

          fail() {
            echo "::error::$1"
            exit 1
          }

          # --jq prints a bare `null` and exits 0 when the field is absent, so
          # an unreadable PR must not read as a head that moved.
          head_sha() {
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha // empty'
          }

          # The action fails the step itself when the session returns no
          # structured output at all, so what reaches here is schema-valid.
          # `null` is the session saying its correctness pass did not complete.
          review=$(jq -ce '
            .review
            | select(type == "object")
            | select((.body | type) == "string")
            | select(.body | test("\\S"))
            | select((.comments | type) == "array")
          ' <<< "${REVIEW_OUTPUT:-}") ||
            fail "the review did not complete: no review payload. Check the claude-review-transcript-${PR_NUMBER} artifact."

          # The workflow appends the run marker, so tracing a review back to
          # the run that produced it costs the session nothing to remember.
          payload=$(jq -ce --arg sha "$REVIEW_HEAD" --arg marker "$REVIEW_MARKER" '
            {event: "COMMENT", commit_id: $sha, body: (.body + "\n\n" + $marker), comments}
          ' <<< "$review")

          current=$(head_sha) || current=""
          [ -n "$current" ] || fail "could not read the PR head SHA"
          if [ "$current" != "$REVIEW_HEAD" ]; then
            fail "The PR changed during the review: ${REVIEW_HEAD} -> ${current}. Comment @claude review for a fresh review."
          fi

          endpoint="repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews"
          errors=$(mktemp)

          if ! response=$(gh api "$endpoint" -X POST --input - <<< "$payload" 2>"$errors"); then
            cat "$errors" >&2

            # Fall back only for the one failure the workflow can fix without
            # asking the session for anything: HTTP 422 with an error naming an
            # inline comment location. GitHub reports that location either in
            # `errors` or in `message` alone, and it answers 422 for spam
            # protection and unrelated validation failures too. Those fail the
            # run rather than quietly dropping to a summary.
            status=$(jq -r '.status // empty' <<< "$response" 2>/dev/null || true)
            if [ -z "$status" ]; then
              status=$(sed -n 's/.*(HTTP \([0-9][0-9]*\)).*/\1/p' "$errors" | head -1)
            fi
            located=$(jq -r '
              def normalise: tostring | ascii_downcase | gsub("[^a-z]"; "");
              if ((((.errors // []) | normalise) + ((.message // "") | normalise))
                    | test("pullrequestreviewthread|mustbepartofthediff|diffhunk"))
                 or ((.errors // []) | any(
                       (type == "object") and
                       ((.field // "") | test("^(line|start_line|start_side|position|path|comments|threads)$"))))
              then "yes" else "no" end
            ' <<< "$response" 2>/dev/null || echo "no")

            if [ "${status:-}" != 422 ] || [ "$located" != yes ] ||
               [ "$(jq -r '.comments | length' <<< "$payload")" -eq 0 ]; then
              fail "GitHub rejected the review (HTTP ${status:-unknown}). Check the PR before retrying with @claude review."
            fi

            # Keep every finding. Each one moves into the summary with the file
            # and lines it was anchored to, so nothing the session found is
            # lost because GitHub would not take the anchor.
            payload=$(jq -ce --arg sha "$REVIEW_HEAD" --arg marker "$REVIEW_MARKER" '
              def anchor:
                .path + ":"
                + (if .start_line then (.start_line | tostring) + "-" else "" end)
                + (.line | tostring);
              {event: "COMMENT", commit_id: $sha,
               body: (.body
                 + "\n\n---\n\n**GitHub rejected the inline comment locations, so every finding is listed here instead.** Reviewed commit `" + $sha + "`.\n\n"
                 + ([.comments[] | "- **" + anchor + "** (" + .side + ")\n\n  " + (.body | gsub("\n"; "\n  "))] | join("\n\n"))
                 + "\n\n" + $marker)}
            ' <<< "$review")

            if ! response=$(gh api "$endpoint" -X POST --input - <<< "$payload" 2>"$errors"); then
              cat "$errors" >&2
              fail "GitHub rejected the review summary as well. Check the PR before retrying with @claude review."
            fi

            # Only now is the downgrade a fact worth announcing.
            echo "::warning::GitHub rejected the inline comment locations; the findings are in the review summary instead."
            {
              echo "### Claude review published without inline comments"
              echo ""
              echo "GitHub rejected the inline comment locations for ${REVIEW_HEAD}."
              echo "Every finding is in the review summary, with the file and lines it was anchored to."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          # Read the submission back rather than trusting the POST: an older
          # review, another bot's review, or a pending one cannot stand in for
          # this run's response.
          review_id=$(jq -er --arg sha "$REVIEW_HEAD" '
            select(.state == "COMMENTED")
            | select(.commit_id == $sha)
            | select((.submitted_at | type) == "string" and (.submitted_at | length) > 0)
            | .id
            | select((type == "number") and . > 0 and floor == .)
          ' <<< "$response") ||
            fail "GitHub did not confirm a submitted review on ${REVIEW_HEAD}. Check the PR before retrying with @claude review."

          # The review is published and confirmed against the commit it
          # reviewed. If the head has moved since, that is not a failure of
          # this run: it only means the newer commits have not been reviewed.
          current=$(head_sha) || current=""
          if [ -n "$current" ] && [ "$current" != "$REVIEW_HEAD" ]; then
            echo "::warning::Published review ${review_id} on ${REVIEW_HEAD}. The head is now ${current}; those commits are unreviewed. Comment @claude review for a fresh review."
            exit 0
          fi

          echo "Published review ${review_id} on ${REVIEW_HEAD}"
