name: Sandbox
on:
  pull_request:
    # Any Go or dependency change can break the wasip1 build, not just changes
    # under experimental/sandbox.
    paths:
      - "**.go"
      - "**/go.mod"
      - "**/go.sum"
      - "experimental/sandbox/**"
      - "mise.toml"
      - ".github/workflows/sandbox.yaml"
  push:
    branches: [main]
    paths:
      - "**.go"
      - "**/go.mod"
      - "**/go.sum"
      - "experimental/sandbox/**"
      - "mise.toml"
      - ".github/workflows/sandbox.yaml"

permissions:
  contents: read

concurrency:
  group: sandbox-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sandbox:
    name: Build gcx.wasm and test the sandbox
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Restore go module cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-deps-sandbox-${{ runner.os }}-${{ hashFiles('go.sum', 'experimental/sandbox/go.sum') }}
          restore-keys: |
            go-deps-sandbox-${{ runner.os }}

      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          install: true
          cache: true

      - name: Build gcx.wasm
        run: experimental/sandbox/build.sh

      # Compiling the module takes ~40s; the cache is only valid for the exact
      # module bytes.
      - name: Restore compiled module cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/gcx-sandbox/compiled
          key: gcx-sandbox-compiled-${{ runner.os }}-${{ hashFiles('experimental/sandbox/gcx.wasm', 'experimental/sandbox/go.sum') }}

      - name: Lint
        working-directory: experimental/sandbox
        run: golangci-lint run -c ../../.golangci.yaml ./...

      - name: Vet and test
        working-directory: experimental/sandbox
        env:
          GCX_SANDBOX_WASM: ${{ github.workspace }}/experimental/sandbox/gcx.wasm
        # The unit tests run under -race; -short skips the e2e tests there
        # (loadGCX), because the race detector slows wazero's cold compile of
        # the module (a cache miss on every change) from ~40s to several
        # minutes. The second run covers the e2e tests without it.
        run: |
          go vet ./...
          # Compile the !linux files too, which no test here runs.
          GOOS=darwin go vet ./...
          GOOS=windows go vet ./...
          go test -race -short ./...
          go test ./...
