name: CI
on:
  pull_request: ~
  push:
    branches: [main] # so that we build a Go cache that can be re-used in PRs

permissions:
  contents: read

jobs:
  linters:
    name: Linters
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Restore go module cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-deps-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-deps-${{ runner.os }}

      - name: Setup mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: mise run deps

      - name: Validate skill front matter
        run: mise run validate-skills

      - name: Run golangci-lint
        run: mise run lint

  test-shards:
    name: Go tests (${{ matrix.shard_number }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard_index: 0
            shard_number: 1
          - shard_index: 1
            shard_number: 2
          - shard_index: 2
            shard_number: 3

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Restore go module cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # 5.0.5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-deps-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-deps-${{ runner.os }}

      - name: Setup mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: mise run deps

      - name: Go tests
        run: mise run tests:cli
        env:
          GCX_TEST_SHARD_COUNT: 3
          GCX_TEST_SHARD_INDEX: ${{ matrix.shard_index }}

      - name: Linter and installer tests
        if: matrix.shard_index == 0
        run: |
          mise run tests:linter
          mise run tests:install

      - name: Upload Go test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-test-results-${{ matrix.shard_index }}
          path: .test-results/
          if-no-files-found: warn

  tests:
    name: Tests
    if: always()
    needs: test-shards
    runs-on: ubuntu-latest
    steps:
      - name: Check test shards
        env:
          SHARD_RESULT: ${{ needs.test-shards.result }}
        run: test "${SHARD_RESULT}" = success

  docs:
    name: Documentation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # Reference generation runs `go run` — cache Go modules to avoid re-downloading
      - name: Restore go module cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-deps-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-deps-${{ runner.os }}

      - name: Setup mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: mise run deps

      - name: Check for drift in the generated documentation references
        run: mise run reference-drift
        shell: bash

      - name: Build documentation
        run: mise run docs
