name: Deploy pr preview

on:
  pull_request:
    types:
      - opened
      - synchronize
      - labeled
      - closed
    paths:
      - "docs/sources/**"

permissions: {}

jobs:
  deploy-pr-preview:
    permissions:
      contents: read
      id-token: write
      pull-requests: write
      statuses: write
    # The preview looks up the PR in grafana/gcx (repo: gcx below), so it
    # fails in any other repository. Skip it outside the canonical repo.
    # A labeled event also fires on closed and merged PRs, and the reusable
    # build and deploy jobs run on any labeled action. Act on it only for an
    # open PR gaining the breakglass label, otherwise the redeploy would
    # outlive the closed-PR teardown and leave an orphaned preview.
    if: >-
      github.repository == 'grafana/gcx'
      && !github.event.pull_request.head.repo.fork
      && (github.event.action != 'labeled'
      || (github.event.pull_request.state == 'open'
      && github.event.label.name == 'docs/ignore-broken-links'))
    uses: grafana/writers-toolkit/.github/workflows/deploy-preview.yml@main # zizmor: ignore[unpinned-uses]
    with:
      branch: ${{ github.head_ref }}
      event_number: ${{ github.event.number }}
      repo: gcx
      sha: ${{ github.event.pull_request.head.sha }}
      sources: |
        [
          {
            "index_file": null,
            "relative_prefix": "/docs/grafana/next/as-code/observability-as-code/grafana-cli/gcx/",
            "repo": "grafana",
            "source_directory": "docs/sources",
            "website_directory": "content/docs/grafana/next",
            "ref": "main"
          },
          {
            "index_file": null,
            "relative_prefix": "/docs/grafana/next/as-code/observability-as-code/grafana-cli/gcx/",
            "repo": "gcx",
            "source_directory": "docs/sources",
            "website_directory": "content/docs/grafana/next/as-code/observability-as-code/grafana-cli/gcx"
          }
        ]
      title: ${{ github.event.pull_request.title }}
