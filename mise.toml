min_version = "2024.1.0"

[tools]
go = "1.26"
golangci-lint = "2.12.2"
goreleaser = "2.13.3"

# =============================================================================
# GENERAL
# =============================================================================

[tasks.all]
description = "Validate skills, lint, test, build, and validate docs"
depends = ["validate-skills", "lint", "tests", "build", "docs"]

[tasks.gate]
description = "Fast pre-push gate for code changes: lint + tests + build (no docs)"
depends = ["lint", "vet:wasip1", "tests", "build"]

# =============================================================================
# DEVELOPMENT
# =============================================================================

[tasks.lint]
description = "Lint the codebase with golangci-lint"
run = "golangci-lint run -c .golangci.yaml"

[tasks."validate-skills"]
description = "Validate skill front matter (claude-plugin/skills + .claude/skills)"
run = "go run ./scripts/validate-skills"

[tasks.tests]
description = "Run all tests (CLI + linter rules + install script)"
depends = ["tests:cli", "tests:linter", "tests:install"]

# GCX_AGENT_MODE is pinned on the leaf tasks (mise env does not propagate
# through `depends`). Without it, agent-mode auto-detection picks up CLAUDECODE
# and friends from the developer's shell and flips confirm-prompt behaviour to
# "requires --force", failing tests that exercise the prompts. CI has no such
# env, so this keeps local runs honest.
[tasks."tests:cli"]
description = "Run CLI tests"
env = { GCX_AGENT_MODE = "false" }
run = "go test ./..."

[tasks."tests:linter"]
description = "Run linter rules tests"
env = { GCX_AGENT_MODE = "false" }
run = "go run ./cmd/gcx/ dev lint test ./internal/linter/bundle/gcx/"

[tasks."tests:install"]
description = "Run the install script tests"
run = "bash scripts/install_test.sh"

[tasks."vet:wasip1"]
description = "Vet packages with wasip1-only files (*_wasip1.go), which host builds never compile"
# cmd/gcx/root needs the third-party wasip1 stubs; experimental/sandbox's
# build covers it.
run = "GOOS=wasip1 GOARCH=wasm go vet ./internal/httputils/ ./internal/style/ ./cmd/gcx/instrumentation/"

[tasks.build]
description = "Build binary to bin/gcx"
run = """
#!/usr/bin/env bash
set -euo pipefail
GIT_REVISION="${GIT_REVISION:-$(git rev-parse --short HEAD)}"
GIT_VERSION="${GIT_VERSION:-$(git describe --tags --exact-match 2>/dev/null || echo "")}"
BUILD_DATE="${BUILD_DATE:-$(date -u +"%Y-%m-%dT%H:%M:%SZ")}"
go build \
    -buildvcs=false \
    -ldflags="-X main.version=${GIT_VERSION} -X main.commit=${GIT_REVISION} -X main.date=${BUILD_DATE}" \
    -o bin/gcx \
    ./cmd/gcx
"""

[tasks.install]
description = "Build and install binary to $GOPATH/bin"
depends = ["build"]
run = """
#!/usr/bin/env bash
set -euo pipefail
GOPATH="${GOPATH:-$(go env GOPATH)}"
[ -n "$GOPATH" ] || { echo "GOPATH is not defined and 'go env GOPATH' returned empty"; exit 1; }
mkdir -p "$GOPATH/bin"
cp bin/gcx "$GOPATH/bin/gcx"
if [ "$(uname)" = "Darwin" ]; then
    codesign -s - "$GOPATH/bin/gcx"
fi
"""

[tasks.deps]
description = "Install Go dependencies"
run = """
#!/usr/bin/env bash
set -euo pipefail
go mod download
"""

[tasks.clean]
description = "Remove build artifacts"
run = "rm -rf bin .venv"

[tasks.setup]
description = "Set up local development environment (commit template, etc.)"
run = """
git config commit.template .gitmessage
echo "Git commit template configured"
"""

[tasks.tag]
description = "Bump version, generate changelog, tag, and push. Usage: mise run tag -- <major|minor|patch>"
run = "./scripts/tag.sh"

# =============================================================================
# DOCUMENTATION
# =============================================================================

[tasks.docs]
description = "Build the Grafana website documentation (requires Docker)"
run = """
docker run --rm -v "$PWD/docs/sources:/hugo/content/docs/grafana/next/as-code/observability-as-code/grafana-cli/gcx:ro" grafana/docs-base:latest /bin/bash -c 'make hugo'
"""

[tasks."docs:refresh"]
description = "Regenerate the latest stable CLI and configuration references locally"
run = "bash scripts/generate-cli-reference.sh"

[tasks."serve-docs"]
description = "Preview Grafana website docs at http://localhost:3002/docs/grafana/next/as-code/observability-as-code/grafana-cli/gcx/"
run = """
docker run --rm -p 3002:3002 -v "$PWD/docs/sources:/hugo/content/docs/grafana/next/as-code/observability-as-code/grafana-cli/gcx:ro" grafana/docs-base:latest hugo server --bind 0.0.0.0 --port 3002 --environment docs
"""

# =============================================================================
# INTEGRATION TESTING
# =============================================================================

[tasks."test-env-up"]
description = "Start Grafana + MySQL test environment"
run = """
#!/usr/bin/env bash
set -euo pipefail
echo "Starting test environment..."
docker-compose up -d
echo "Waiting for services to be healthy..."
for i in {1..30}; do
    if docker-compose ps | grep -q "healthy"; then
        echo "Services are healthy!"
        echo ""
        echo "Grafana is available at: http://localhost:3000"
        echo "Credentials: admin/admin"
        echo ""
        echo "Test with: mise run test-env-status"
        exit 0
    fi
    echo -n "."
    sleep 1
done
echo ""
echo "Warning: Services may still be starting up. Check with: docker-compose ps"
"""

[tasks."test-env-down"]
description = "Stop and remove the test environment"
run = """
echo "Stopping test environment..."
docker-compose down
"""

[tasks."test-env-clean"]
description = "Stop the test environment and remove all volumes"
run = """
echo "Stopping test environment and removing volumes..."
docker-compose down -v
"""

[tasks."test-env-status"]
description = "Show status of test environment services"
run = "docker-compose ps"

[tasks."test-env-logs"]
description = "Show logs from the test environment"
run = "docker-compose logs -f"
