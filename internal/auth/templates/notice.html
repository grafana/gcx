<!DOCTYPE html>
<html>
<head>
    <title>Nothing to do - gcx</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #111217;
            color: #fff;
        }
        .container {
            text-align: center;
            padding: 40px;
            max-width: 440px;
        }
        .notice-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            background: rgba(110, 159, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .notice-icon svg {
            width: 40px;
            height: 40px;
            color: #6e9fff;
        }
        h1 {
            margin: 0 0 16px 0;
            font-size: 24px;
            font-weight: 600;
        }
        .message {
            background: rgba(110, 159, 255, 0.1);
            border: 1px solid rgba(110, 159, 255, 0.3);
            border-radius: 6px;
            padding: 12px 16px;
            margin: 20px 0;
            color: #cbd9ff;
            font-size: 14px;
        }
        p {
            color: #aaa;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="notice-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="16" x2="12" y2="12"/>
                <line x1="12" y1="8" x2="12.01" y2="8"/>
            </svg>
        </div>
        <h1>Nothing to do here</h1>
        <div class="message">{{.Message}}</div>
        <p>You can close this window.</p>
    </div>
</body>
</html>
